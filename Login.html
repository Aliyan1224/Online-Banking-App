<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="card-container">
        <div class="card">
            <h1>Login</h1>
            <div id="error-message"></div>
            <form class="input-forms" id="login-form">
                <input class="forms" type="text" placeholder="Account Number" id="login-account-number" required>
                <input class="forms" type="password" placeholder="Password" id="login-password" required>
                <button class="button" type="submit" id="login-submit">Login</button>
            </form>
        </div>
    </div>

    <script src="frontend/login.js"></script>
</body>

</html>
