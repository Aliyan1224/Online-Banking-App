<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="register-card">
        <h1>Register</h1>
        <div id="error-message"></div>
        <form class="forms-input" id="register-form">
            <input class="forms" type="name" placeholder="Name" id="register-name" required>
            <input class="forms" type="email" placeholder="Email" id="register-email" required>
            <input class="forms" type="password" placeholder="Password" id="register-password" required>
            <button class="button" type="submit" id="register-submit">Register</button>
        </form>
    </div>
    <script type="module" src="frontend/register.js"></script>
</body>

</html>
